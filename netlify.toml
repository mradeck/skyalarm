# Netlify-Konfiguration für SkyAlarm
# Kein Build-Schritt nötig: Single-File-PWA wird direkt aus dem Repository ausgeliefert.

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Root → /skyalarm.html (saubere URL ohne Endung)
[[redirects]]
  from = "/"
  to = "/skyalarm.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Sicherheits-Header (Defense-in-Depth). Die App ist eine Single-File-Inline-Script-PWA,
# daher ist script-src 'unsafe-inline' unvermeidbar; die eigentliche Schutzwirkung gegen
# eingeschleuste Callsign-/Zonennamen-Payloads liefert das restriktive connect-src/img-src
# (keine Exfiltration an fremde Hosts). Zusammen mit dem serverseitigen escapeHtml deckt das
# den XSS-Vektor doppelt ab.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://cdnjs.cloudflare.com https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org https://server.arcgisonline.com https://uas-betrieb.de; connect-src 'self' https://api.airplanes.live https://api.brightsky.dev https://api.open-meteo.com https://uas-betrieb.de; font-src 'self' data:; worker-src 'self'; manifest-src 'self'"
